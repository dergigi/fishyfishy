name: FishyFishy
summary: A little journal for big underwater discoveries
description: |
  Explore Madeira's ocean life with your little snorkeler.

  A visual, offline field guide to 17 fish and ocean creatures, with English,
  Portuguese, German and scientific names. Hear names spoken aloud using
  installed offline voices, learn a little ocean fact, and play a photo quiz.

  Save your swims, remember what you saw, and grow your own discovery collection.
  Mark uncertain sightings to check together later. Choose a local journal folder
  to sync between devices with Syncthing. Compare blue markings and schooling fish.

  Built for Android phones and tablets. No accounts, ads, tracking or internet
  permission. Interface and lessons are in English. Free and open source.
